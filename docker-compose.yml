services:
    # --- FASTAPI SERVER ----------------------------------------------------
    fastapi_server:
        build:
            context: .
            dockerfile: fast-api.dockerfile
            tags:
                - danjustdanyeah/python-poetry-fastapi-server:latest
        env_file:
            - .env
        environment:
            - APP_PORT=${APP_PORT}
            - APP_JWT_ALGORITHM=${APP_JWT_ALGORITHM}
            - APP_JWT_SECRET_KEY=${APP_JWT_SECRET_KEY}
            - APP_JWT_EXPIRATION=${APP_JWT_EXPIRATION}
            - APP_JWT_TOKEN_TYPE=${APP_JWT_TOKEN_TYPE}
            - FILE_LOGGER_DOCKER_HOST_MACHINE_PATH=${FILE_LOGGER_DOCKER_HOST_MACHINE_PATH}
            - PG_DB_HOST=${PG_DB_DOCKER_SERVICE_NAME}
            - PG_DB_PORT=${PG_DB_PORT}
            - PG_DB_NAME=${PG_DB_NAME}
            - PG_DB_USERNAME=${PG_DB_USERNAME}
            - PG_DB_PASSWORD=${PG_DB_PASSWORD}
#         healthcheck:
#             test: [ "CMD-SHELL", "curl -f -H 'X-API-Key: '${APP_HEALTH_CHECK_API_KEY}' http://172.10.0.10:${APP_PORT}/api/utils/health_check || exit 1" ]
#             interval: 3s
#             timeout: 3s
#             retries: 3
        ports:
            - "${APP_PORT}:${APP_PORT}"
        networks:
            skynet:
                ipv4_address: 172.10.0.10
        volumes:
            - "${FILE_LOGGER_DOCKER_HOST_MACHINE_PATH}:/logs"
        depends_on:
            postgres_db:
                condition: service_healthy
            mongo_db:
                condition: service_healthy
        restart: always

    # --- POSTGRES DB --------------------------------------------------------
    postgres_db:
        image: postgres:16.9-alpine
        shm_size: 128mb
        env_file:
            - .env
        environment:
            POSTGRES_USER: "${PG_DB_USERNAME}"
            POSTGRES_PASSWORD: "${PG_DB_PASSWORD}"
            POSTGRES_DB: "${PG_DB_NAME}"
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
            POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
            PGDATA: "${PG_DB_DOCKER_DATA_PATH}"
            POSTGRES_LISTEN_ADDRESSES: 172.10.0.10
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${PG_DB_USERNAME} -d ${PG_DB_NAME}" ]
            interval: 3s
            timeout: 3s
            retries: 3
        ports:
            - "${PG_DB_PORT}:${PG_DB_PORT}"
#         The following part is commented out in favour of using 'ports' in development mode. The
#         level of exposure is higher with 'ports' to allow for connections from the host machine.
#         This is not recommended for production use, where you should use 'expose' instead if
#         you like to protect the database from access outside of the docker network.
#         expose:
#             - "${PG_DB_PORT}:${PG_DB_PORT}"
        networks:
            skynet:
                ipv4_address: 172.10.0.20
        volumes:
            - "${PG_DB_VOLUME_PATH}:${PG_DB_DOCKER_DATA_PATH}"
        restart: always

    # --- MONGO DB -----------------------------------------------------------
    mongo_db:
        image: mongodb/mongodb-community-server:latest
        env_file:
            - .env
        environment:
            MONGODB_INITDB_ROOT_USERNAME: "${MONGO_DB_USERNAME}"
            MONGODB_INITDB_ROOT_PASSWORD: "${MONGO_DB_PASSWORD}"
            MONGODB_INITDB_DATABASE: "${MONGO_DB_NAME}"
            CONN_STR: "${MONGO_DB_URL}"
            MONGO_DB_DOCKER_HOST_VOLUME_PATH: "${MONGO_DB_DOCKER_HOST_VOLUME_PATH}"
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
            interval: 3s
            timeout: 3s
            retries: 3
        ports:
            - "${MONGO_DB_PORT}:27017"
#         expose:
#             - "${MONGO_DB_PORT}:27017"
        networks:
            skynet:
                ipv4_address: 172.10.0.30
        volumes:
            - "${MONGO_DB_DOCKER_HOST_VOLUME_PATH}:/data/db"
        command: ["mongod", "--bind_ip_all"]
        restart: always

networks:
    skynet:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.10.0.0/16

volumes:
    fastapi_logs:
        driver: local
    postgres_data:
        driver: local
    mongo_db_data:
        driver: local
