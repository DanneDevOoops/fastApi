version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Minerva timing attack (GHSA-7f5h-v6xp-fcq8) does not affect
      # HMAC-based JWT signing (HS256/HS512); transitive via python-jose.
      - dependency-name: "python-ecdsa"
