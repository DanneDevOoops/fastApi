name: Build and deploy documentation to GH-pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - ".github/actions/build-sphinx/**"
      - ".github/actions/deploy-gh-pages/**"
      - ".github/actions/setup-python-poetry/**"
      - ".github/workflows/entry-docs-ci.yml"
      - ".github/workflows/reusable-docs-build-deploy.yml"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

jobs:
  docs:
    uses: ./.github/workflows/reusable-docs-build-deploy.yml
    secrets: inherit
    with:
      python-version: "3.13.12"
      poetry-version: "2.1.3"
      cache-dependency-path: "**/poetry.lock"
      docs-artifact-name: sphinx-docs
      publish-dir: ./gh-pages
      publish-branch: gh-pages

