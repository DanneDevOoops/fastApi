name: Python formatting pipeline

on:
  workflow_call:
    inputs:
      venv-artifact-name:
        description: Name of the virtualenv artifact
        type: string
        required: false
        default: "python-venv"
      python-paths:
        description: Paths to format or check
        type: string
        required: false
        default: "src"
      run-mode:
        description: Mode to run - format or check
        type: string
        required: false
        default: "format"
      commit-message:
        description: Commit message used in format mode
        type: string
        required: false
        default: "ci: auto-format Python code (isort + black)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format_or_check:
    name: ${{ inputs.run-mode == 'format' && 'Format Python Code' || 'Check Python Formatting' }}
    runs-on: ubuntu-latest
    permissions:
      contents: ${{ inputs.run-mode == 'format' && 'write' || 'read' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.run-mode == 'format' && '0' || '1' }}

      - name: Download virtual environment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv

      - name: Restore virtualenv execute permissions
        shell: bash
        run: chmod -R u+x .venv/bin

      - name: Format or check Python code
        uses: ./.github/actions/format-python
        with:
          python-bin: .venv/bin/python
          python-paths: ${{ inputs.python-paths }}
          run-mode: ${{ inputs.run-mode }}

      - name: Commit and push formatting changes
        if: inputs.run-mode == 'format'
        uses: ./.github/actions/git-commit-and-push
        with:
          commit-message: ${{ inputs.commit-message }}
