# This is a workflow to build documentation with Sphinx and then publish
#  the documentation to GitHub pages. The idea is to avoid any documentation
# later or by a third party. Simply write docstrings to document your code
# while coding.
name: Build and deploy documentation to GH-pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or
# in parallel
jobs:
  # This workflow contains a single job called "build"
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python + Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: "3.11.14"
          poetry-version: "1.8.3"
          cache-dependency-path: "**/poetry.lock"

      - name: Build docs with Sphinx
        uses: ./.github/actions/build-sphinx

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/deploy-gh-pages
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-dir: ./gh-pages
          publish-branch: gh-pages
