name: CI Workflow - build, lint and test Python codebase

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        required: false
        default: "3.13.12"
      poetry-version:
        description: Poetry version to install
        type: string
        required: false
        default: "2.1.3"
      cache-dependency-path:
        description: Path or glob for dependency lock files
        type: string
        required: false
        default: "**/poetry.lock"
      venv-artifact-name:
        description: Name of the virtualenv artifact
        type: string
        required: false
        default: "python-venv"
      lint-target-path:
        description: Path to lint
        type: string
        required: false
        default: "src"
      pylint-args:
        description: Extra pylint arguments
        type: string
        required: false
        default: "--verbose"
      pytest-args:
        description: Extra pytest arguments
        type: string
        required: false
        default: "--verbose"
      run-lint:
        description: Whether to run lint job
        type: boolean
        required: false
        default: true
      run-unit-tests:
        description: Whether to run unit test job
        type: boolean
        required: false
        default: true
      run-integration-tests:
        description: Whether to run integration test job
        type: boolean
        required: false
        default: true
      run-e2e-tests:
        description: Whether to run e2e test job
        type: boolean
        required: false
        default: true
    secrets:
      E2E_TEST_PASSWORD:
        description: Password used in e2e test fixtures
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare_env:
    name: Prepare Python environment
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Python environment
        uses: ./.github/actions/prepare-python-environment
        with:
          python-version: ${{ inputs.python-version }}
          poetry-version: ${{ inputs.poetry-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Upload virtual environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  lint_application:
    name: Lint application codebase
    needs: [prepare_env]
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download virtual environment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv

      - name: Restore virtualenv execute permissions
        shell: bash
        run: chmod -R u+x .venv/bin

      - name: Run linting
        uses: ./.github/actions/lint-python
        with:
          python-bin: .venv/bin/python
          target-path: ${{ inputs.lint-target-path }}
          pylint-args: ${{ inputs.pylint-args }}

  test_unit:
    name: Run unit tests
    needs: [prepare_env]
    if: ${{ inputs.run-unit-tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download virtual environment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv

      - name: Restore virtualenv execute permissions
        shell: bash
        run: chmod -R u+x .venv/bin

      - name: Run unit tests
        uses: ./.github/actions/test-python
        with:
          python-bin: .venv/bin/python
          pytest-args: ${{ inputs.pytest-args }}
          test-path: tests/unit

  test_integration:
    name: Run integration tests
    needs: [prepare_env]
    if: ${{ inputs.run-integration-tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download virtual environment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv

      - name: Restore virtualenv execute permissions
        shell: bash
        run: chmod -R u+x .venv/bin

      - name: Run integration tests
        uses: ./.github/actions/test-python
        with:
          python-bin: .venv/bin/python
          pytest-args: ${{ inputs.pytest-args }}
          test-path: tests/integration

  test_e2e:
    name: Run E2E tests
    needs: [prepare_env]
    if: ${{ inputs.run-e2e-tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Download virtual environment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.venv-artifact-name }}
          path: .venv

      - name: Restore virtualenv execute permissions
        shell: bash
        run: chmod -R u+x .venv/bin

      - name: Run E2E tests
        uses: ./.github/actions/test-python
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        with:
          python-bin: .venv/bin/python
          pytest-args: ${{ inputs.pytest-args }} -m e2e
          test-path: tests/e2e

