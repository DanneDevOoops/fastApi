name: Python CI pipeline
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} • {1} → {2}', github.event.pull_request.number, github.head_ref, github.base_ref)
      || github.event_name == 'push'
      && format('Push • {0} • {1}', github.ref_name, github.sha)
      || format('Manual run • {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main, stage, test, dev]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate_branch_policy:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/branch-merge-policy.yml
    secrets: inherit

  python-ci:
    needs: [validate_branch_policy]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.validate_branch_policy.result == 'success') }}
    uses: ./.github/workflows/python-ci-pipeline.yml
    secrets: inherit
    with:
      python-version: "3.11.14"
      poetry-version: "1.8.3"
      cache-dependency-path: "**/poetry.lock"
      venv-artifact-name: python-venv
      lint-target-path: src
      pylint-args: "--verbose"
      pytest-args: "--verbose"
      run-lint: ${{ github.event_name == 'pull_request' }}
      run-unit-tests: ${{ github.event_name == 'pull_request' }}
      run-integration-tests: ${{ github.event_name == 'pull_request' }}

  format_on_merge:
    needs: [python-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/python-format-pipeline.yml
    secrets: inherit
    with:
      venv-artifact-name: python-venv
      python-paths: src
      run-mode: format
      commit-message: "ci: auto-format Python code (isort + black)"

  check_format_for_forks:
    needs: [python-ci]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/python-format-pipeline.yml
    secrets: inherit
    with:
      venv-artifact-name: python-venv
      python-paths: src
      run-mode: check
