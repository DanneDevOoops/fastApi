name: Setup Python and Poetry
description: Setup Python, enable Poetry cache, and install Poetry.

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.11.14"
  poetry-version:
    description: Poetry version to install
    required: false
    default: "1.8.3"
  cache-dependency-path:
    description: Path/pattern to dependency lock file(s)
    required: false
    default: "poetry.lock"

runs:
  using: composite
  steps:
    - name: Setup Python + Poetry cache
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: poetry
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install Poetry
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry==${{ inputs.poetry-version }}

    - name: Add Poetry to PATH
      shell: bash
      run: |
        echo "$(python -c 'import site; print(site.USER_SITE)')/bin" >> "$GITHUB_PATH"

    - name: Configure Poetry
      shell: bash
      run: python -m poetry config virtualenvs.in-project true

    - name: Verify Poetry installation
      shell: bash
      run: |
        python --version
        python -m poetry --version
